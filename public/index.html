<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brightline Coffee Gear — Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f1ea;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #4b2e1e;
      color: #fff;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 600;
    }
    header span { display: block; font-size: 0.8rem; font-weight: 400; opacity: 0.8; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2f6f4e; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; color: #2b2b2b; border-bottom-left-radius: 4px; }
    .msg.error { background: #fdecea; color: #a33; }
    form { display: flex; gap: 8px; padding: 14px; background: #fff; border-top: 1px solid #e2d9cd; }
    input { flex: 1; padding: 11px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button {
      padding: 11px 20px; border: none; border-radius: 8px;
      background: #4b2e1e; color: #fff; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    Brightline Coffee Gear — Support
    <span>Ask about products, shipping, or returns</span>
  </header>
  <div id="chat">
    <div class="msg bot">Hi! I'm Nova ☕ How can I help you today?</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Type your message…" autocomplete="off" autofocus />
    <button id="send">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      send.disabled = true;
      addMsg(text, "user");
      const pending = addMsg("Thinking…", "bot");
      history.push({ role: "user", content: text });

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.className = "msg error";
        pending.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
