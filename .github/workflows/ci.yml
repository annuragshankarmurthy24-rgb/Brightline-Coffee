name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Boot and smoke test
        env:
          PORT: 3999
        run: |
          node server.js &
          for i in $(seq 1 15); do
            curl -sf http://localhost:3999/ > /dev/null && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3999/)
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3999/api/chat \
            -H 'Content-Type: application/json' -d '{}')
          test "$code" = "400"
